<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Work Time Calculator</title>

    <style>
        :root {
            --bg: #eef2f7;
            --panel: #ffffff;
            --panel-soft: #f7f9fc;
            --ink: #172033;
            --muted: #6b7280;
            --line: #d9e1ec;
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --success: #15803d;
            --warning: #dc2626;
            --accent: #0f766e;
            --shadow: 0 24px 55px rgba(23, 32, 51, 0.14);
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            color: var(--ink);
            background:
                radial-gradient(circle at top left, rgba(37, 99, 235, 0.16), transparent 32rem),
                linear-gradient(135deg, #eef2f7 0%, #f8fafc 48%, #e8f4f1 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 28px 16px;
        }

        .app {
            width: min(920px, 100%);
            background: var(--panel);
            border: 1px solid rgba(217, 225, 236, 0.88);
            border-radius: 8px;
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        .header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 18px;
            padding: 28px;
            background: #172033;
            color: #ffffff;
        }

        .eyebrow {
            margin: 0 0 8px;
            color: #9ee7d8;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            font-size: clamp(28px, 4vw, 42px);
            line-height: 1.05;
            font-weight: 800;
            letter-spacing: 0;
        }

        .current-time {
            min-width: 142px;
            padding: 12px 14px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            text-align: right;
            background: rgba(255, 255, 255, 0.08);
        }

        .current-time span {
            display: block;
            color: #c8d4e6;
            font-size: 12px;
            margin-bottom: 4px;
        }

        .current-time strong {
            display: block;
            font-size: 24px;
            line-height: 1.1;
        }

        .content {
            display: grid;
            grid-template-columns: minmax(260px, 320px) 1fr;
            gap: 0;
        }

        .control-panel {
            padding: 28px;
            border-right: 1px solid var(--line);
            background: var(--panel-soft);
        }

        .field {
            margin-bottom: 18px;
        }

        .duration-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
        }

        .section-label {
            margin: 0 0 10px;
            color: var(--muted);
            font-size: 12px;
            font-weight: 800;
            text-transform: uppercase;
        }

        .duration-group {
            margin-bottom: 18px;
            padding: 14px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: #ffffff;
        }

        .duration-title {
            display: block;
            margin-bottom: 10px;
            color: var(--ink);
            font-size: 13px;
            font-weight: 800;
        }

        .duration-field label {
            margin-bottom: 6px;
            font-size: 12px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: var(--muted);
            font-size: 13px;
            font-weight: 700;
        }

        input,
        button {
            width: 100%;
            min-height: 48px;
            font: inherit;
            border-radius: 8px;
        }

        input {
            color: var(--ink);
            background: #ffffff;
            border: 1px solid var(--line);
            padding: 0 14px;
            font-size: 18px;
            outline: none;
        }

        input[type="number"] {
            font-size: 16px;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.14);
        }

        button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            border: 0;
            background: var(--primary);
            color: #ffffff;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.2s ease;
        }

        button:hover {
            background: var(--primary-dark);
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(0);
        }

        .hint {
            margin: 14px 0 0;
            color: var(--muted);
            font-size: 13px;
            line-height: 1.45;
        }

        .hint-card {
            margin-top: 14px;
            padding: 14px;
            border: 1px solid rgba(15, 118, 110, 0.18);
            border-left: 4px solid var(--accent);
            border-radius: 8px;
            background: #f3fbf9;
            color: var(--muted);
            font-size: 13px;
            line-height: 1.45;
        }

        .hint-title {
            display: block;
            margin-bottom: 6px;
            color: var(--ink);
            font-size: 14px;
            font-weight: 800;
        }

        .hint-meta {
            display: block;
            color: var(--muted);
        }

        .results {
            padding: 28px;
            min-height: 320px;
        }

        .empty-state {
            height: 100%;
            min-height: 260px;
            display: grid;
            place-items: center;
            color: var(--muted);
            text-align: center;
            border: 1px dashed var(--line);
            border-radius: 8px;
            background: #fbfcfe;
            padding: 24px;
        }

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 14px;
        }

        .metric {
            border: 1px solid var(--line);
            border-radius: 8px;
            background: #ffffff;
            padding: 18px;
            min-height: 122px;
        }

        .metric.full {
            grid-column: 1 / -1;
            background: #f8fbff;
        }

        .metric-label {
            margin: 0 0 10px;
            color: var(--muted);
            font-size: 13px;
            font-weight: 700;
        }

        .metric-value {
            margin: 0;
            color: var(--ink);
            font-size: clamp(24px, 4vw, 36px);
            font-weight: 800;
            line-height: 1.1;
        }

        .metric-sub {
            margin: 8px 0 0;
            color: var(--muted);
            font-size: 13px;
        }

        .success {
            color: var(--success);
        }

        .accent {
            color: var(--accent);
        }

        .danger {
            color: var(--warning);
        }

        .progress {
            height: 12px;
            margin-top: 14px;
            border-radius: 999px;
            background: #e5eaf2;
            overflow: hidden;
        }

        .progress span {
            display: block;
            height: 100%;
            width: 0;
            border-radius: inherit;
            background: linear-gradient(90deg, var(--accent), var(--primary));
            transition: width 0.35s ease;
        }

        .notice {
            margin-top: 14px;
            color: var(--warning);
            font-size: 13px;
            font-weight: 700;
        }

        @media (max-width: 760px) {
            body {
                align-items: flex-start;
            }

            .header,
            .content {
                display: block;
            }

            .header {
                padding: 24px;
            }

            .current-time {
                margin-top: 18px;
                text-align: left;
            }

            .control-panel {
                border-right: 0;
                border-bottom: 1px solid var(--line);
            }

            .summary-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <main class="app">
        <header class="header">
            <div>
                <p class="eyebrow">Daily tracker</p>
                <h1>Work Time Calculator</h1>
            </div>
            <div class="current-time" aria-live="polite">
                <span>Current time</span>
                <strong id="currentTime">--:--</strong>
            </div>
        </header>

        <section class="content">
            <div class="control-panel">
                <div class="field">
                    <label for="startTime">Start time</label>
                    <input type="time" id="startTime" onchange="startAutoCalculate()">
                </div>

                <p class="section-label">Optional workday setup</p>

                <div class="duration-group">
                    <span class="duration-title">Half day duration</span>
                    <div class="duration-grid">
                        <div class="duration-field">
                            <label for="halfDayHours">Hours</label>
                            <input type="number" id="halfDayHours" min="0" max="23" value="4" onchange="handleDurationChange()" oninput="handleDurationChange()">
                        </div>
                        <div class="duration-field">
                            <label for="halfDayMinutes">Minutes</label>
                            <input type="number" id="halfDayMinutes" min="0" max="59" value="30" onchange="handleDurationChange()" oninput="handleDurationChange()">
                        </div>
                    </div>
                </div>

                <div class="duration-group">
                    <span class="duration-title">Full day duration</span>
                    <div class="duration-grid">
                        <div class="duration-field">
                            <label for="fullDayHours">Hours</label>
                            <input type="number" id="fullDayHours" min="0" max="23" value="9" onchange="handleDurationChange()" oninput="handleDurationChange()">
                        </div>
                        <div class="duration-field">
                            <label for="fullDayMinutes">Minutes</label>
                            <input type="number" id="fullDayMinutes" min="0" max="59" value="30" onchange="handleDurationChange()" oninput="handleDurationChange()">
                        </div>
                    </div>
                </div>

                <button type="button" onclick="startAutoCalculate()">Calculate</button>
                <div class="hint" id="message">Choose your punch-in time to track half day and full day completion.</div>
            </div>

            <div class="results" id="result">
                <div class="empty-state">Your working time summary will appear here.</div>
            </div>
        </section>
    </main>
